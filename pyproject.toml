[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pizzeria-dashboard"
version = "0.3.19"
description = "A local production dashboard for Pizzeria Mari."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3,<4",
    "werkzeug>=3.1.6,<4",
    "python-dotenv>=1.1,<2",
]

[project.scripts]
pizzeria-dashboard = "pizzeria_dashboard.__main__:main"
pizzeria-square-check = "pizzeria_dashboard.square_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["pizzeria_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
