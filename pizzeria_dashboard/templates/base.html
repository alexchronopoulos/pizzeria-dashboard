<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#005586">
    <title>{% block title %}Pizzeria Mari Production Board{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='0.5.9') }}">
</head>
<body>
    <main class="page-shell">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="message-stack" aria-live="polite">
            {% for category, message in messages %}
            <div class="message message--{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
