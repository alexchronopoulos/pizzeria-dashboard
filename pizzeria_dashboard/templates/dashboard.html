{% extends "base.html" %}

{% block content %}
<header class="masthead">
    <div>
        <p class="eyebrow">Pizzeria Mari</p>
        <h1>Production board</h1>
        <p class="service-date">{{ service.service_date.strftime('%A, %B %-d, %Y') }}</p>
    </div>
    <div class="masthead-tools">
        <nav class="date-navigation" aria-label="Service date navigation">
            <a class="date-step" href="{{ url_for('dashboard.index', date=previous_service_date.isoformat()) }}" aria-label="View previous day">←</a>
            <form class="date-picker" method="get" action="{{ url_for('dashboard.index') }}">
                <label for="service-date">Service date</label>
                <div class="date-picker-row">
                    <input id="service-date" type="date" name="date" value="{{ selected_date.isoformat() }}">
                    <button type="submit">View</button>
                </div>
            </form>
            <a class="date-step" href="{{ url_for('dashboard.index', date=next_service_date.isoformat()) }}" aria-label="View next day">→</a>
        </nav>
        {% if selected_date != today %}
        <a class="today-link" href="{{ url_for('dashboard.index', date=today.isoformat()) }}">Return to today</a>
        {% endif %}
        <div class="live-indicator" aria-label="Dashboard status">
            <span class="live-dot"></span>
            Sample data
        </div>
    </div>
</header>

<div id="production-board">
    {% include "_production_board.html" %}
</div>
{% endblock %}
